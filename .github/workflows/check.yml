name: check

on:
  push:
  pull_request:

jobs:
  # `claude plugin validate` reads the marketplace + each plugin's manifest, hooks file and skills
  # the way Claude Code will at install time. --strict turns warnings (reserved-looking names,
  # missing metadata, unquoted path variables in hook commands) into failures. Validating the
  # marketplace also validates every relative-path plugin's manifest; the per-plugin runs add the
  # hooks/skills checks.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate --strict .
      - run: |
          for p in plugins/*/; do
            claude plugin validate --strict "$p"
          done
      # The mod's tests run against the engine's test kit: no session, sign-in or network.
      - run: claude plugin test plugins/statusline-dashboard
      # The hook dispatchers are the one piece of shell every platform runs (Git Bash on Windows).
      - run: |
          sh -n plugins/session-color/hooks/session-color.sh
          sh -n plugins/notifications/hooks/notifications.sh
          sh -n plugins/session-color/linux/session-color.sh
          sh -n plugins/session-color/macos/session-color.sh
          bash -n plugins/notifications/macos/setup.sh

  # The native hook binaries: make sure the Rust crates and the Swift package still build on the
  # platforms /session-color:setup and /notifications:setup build them on.
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --manifest-path plugins/session-color/windows/Cargo.toml
      - run: cargo build --release --manifest-path plugins/notifications/windows/Cargo.toml
      # Parse-check the setup scripts (the runner's default shell is already pwsh; no escaping games).
      - shell: pwsh
        run: |
          foreach ($f in 'plugins/session-color/windows/setup.ps1', 'plugins/notifications/windows/setup.ps1') {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f, [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { $parseErrors; exit 1 }
            Write-Host "parsed $f"
          }

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: swift build -c release --package-path plugins/notifications/macos
